spring.application.name=ADDRESS


server.port=8082
spring.datasource.url=jdbc:mysql://localhost:3306/AddressZestIndia?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=root

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect





# Do not register Eureka Server itself
eureka.client.register-with-eureka=true
# Do not fetch service registry from another Eureka Server
eureka.client.fetch-registry=true

eureka.instance.hostname=localhost
eureka.client.service-url.defaultZone=http://localhost:8761/eureka




employee.service.url=http://localhost:8081/employees


